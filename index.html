<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiteForge AI - Build Anything</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.agent-thinking { border-left: 2px solid #8b5cf6; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
.code-typing { font-family: monospace; white-space: pre-wrap; }
.live-iframe { width:100%; height:100%; border:none; background:white; }
</style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen flex flex-col">
<header class="flex justify-between items-center p-4 border-b border-zinc-800">
<div class="font-bold text-xl"><i class="fa-solid fa-bolt text-violet-500"></i> SiteForge AI</div>
<div id="userArea" class="flex items-center gap-3">
<span id="creditsBadge" class="hidden bg-zinc-800 px-3 py-1 rounded-full text-sm">20 Credits • 4 Days Left</span>
<button id="loginBtn" class="bg-white text-black px-4 py-2 rounded-lg font-semibold">Sign in with Google</button>
<img id="userPic" class="hidden w-8 h-8 rounded-full"/>
</div>
</header>
<div id="mainApp" class="flex flex-1 flex-col lg:flex-row">
<div class="w-full lg:w-[45%] p-6 border-r border-zinc-800 flex flex-col">
<h1 class="text-3xl font-bold mb-2">What do you want to build?</h1>
<p class="text-zinc-400 text-sm mb-4">1 Website = 5 Credits. You have <span id="creditCount">20</span> credits in free trial.</p>
<textarea id="promptInput" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-4 h-32 outline-none focus:border-violet-500" placeholder="Build me a modern SaaS landing page with pricing..."></textarea>
<button id="generateBtn" class="mt-4 bg-violet-600 hover:bg-violet-500 py-3 rounded-xl font-bold"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate Website</button>
<div id="agentArea" class="mt-6 hidden">
<div class="agent-thinking pl-4 py-2 text-sm text-zinc-300" id="agentStatus">Agent Thinking...</div>
<pre id="codeOutput" class="code-typing mt-4 bg-zinc-900 p-4 rounded-xl text-xs text-green-300 h-[300px] overflow-auto"></pre>
</div>
</div>
<div class="w-full lg:w-[55%] bg-white relative flex flex-col">
<div class="bg-zinc-100 text-black text-xs p-2 flex justify-between">
<span>Live Preview</span>
<div class="flex gap-2">
<button id="copyCodeBtn" class="bg-black text-white px-2 py-1 rounded">Copy Code</button>
<button id="downloadBtn" class="bg-black text-white px-2 py-1 rounded">Download</button>
<button id="getLinkBtn" class="bg-violet-600 text-white px-2 py-1 rounded">Get Live Link</button>
</div>
</div>
<iframe id="livePreview" class="live-iframe flex-1 min-h-[500px]"></iframe>
</div>
</div>

<script>
// ====== SUPABASE FINAL - MACHAN MEKA THAMAI API EKA ======
const SUPABASE_URL = "https://zltwxsprmksnrtinyqyb.supabase.co";
const SUPABASE_KEY = "sb_publishable_x6ej4sKqjbnsSc9IS1TBFQ_4zTpQKMO";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById('loginBtn').onclick = async () => {
  const { error } = await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin } });
  if(error) alert(error.message);
};
supabaseClient.auth.onAuthStateChange((event, session) => {
  if(session){
    document.getElementById('loginBtn').classList.add('hidden');
    document.getElementById('userPic').src = session.user.user_metadata.avatar_url;
    document.getElementById('userPic').classList.remove('hidden');
    document.getElementById('creditsBadge').classList.remove('hidden');
  }
});
</script>
</body>
</html>
